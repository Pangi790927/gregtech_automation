# config.ini - this PC's own addresses, which the repo's tools read and git never sees.
# Copy this file to config.ini beside it and fill it in; config.ini is in .gitignore.
# One `key = value` per line and `#` comments on their own lines, so Python, Lua and
# PowerShell's ConvertFrom-StringData all read it as it is.

# The Minecraft server, as this PC reaches it (script-requests, the firewall rule).
server = 192.168.1.20
# The user on the server that script-requests log in as.
ssh_user = someone
# This PC, as the server reaches it: where octerm on the computers finds relay.exe
# (install_octerm.py writes it to the computer). The server's OpenComputers blacklist
# must leave this one address open.
pc = 192.168.1.30
# relay.exe's port for the computers (relay.exe's own default is 7777).
computer_port = 7777
